[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-ml-service"
version = "0.1.0"
description = "XGBoost + LLM product recommendations for the shoppingwebsite PostgreSQL database"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Database
    "psycopg2-binary>=2.9",
    # ML
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    # LLM providers (one is chosen at startup via LLM_PROVIDER)
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    # Config
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.3",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
